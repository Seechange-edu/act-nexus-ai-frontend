name: User changelog

run-name: User changelog · Nexus-AI ${{ github.event.client_payload.tag }} (${{ github.event.client_payload.scope }})

# Writes (or rewrites) the user-facing notes of one Nexus-AI release on request:
# for a release that did not ask for them, one whose run failed, or to try the
# changelog out. The automatic path is the `changelog` job after a deploy.
#
# Started only from Nexus-AI's own changelog.yml, which sends repository_dispatch
# `changelog` {tag, scope, previous} here with ACTION_TOKEN: every action is
# taken in the private source repository, and this one only runs it and shows
# the result. The payload is read through env and checked before anything
# uses it.
#
# 🔴 This repository is PUBLIC: its logs, job summaries and artifacts are
# readable by anyone. `quiet` keeps the notes and error details out of them;
# they land only in the source repository's (private) release (the run itself
# is changelog-run.yml, shared with ci.yml's post-deploy job). To read a run's
# details, run the repo-toolkit CLI locally instead:
#   repo-toolkit changelog --repo <checkout> --tag <tag> --scope single --dry-run
on:
  repository_dispatch:
    types: [changelog]

permissions:
  contents: read

jobs:
  # Free text from the payload is checked here and handed on as job outputs,
  # so nothing unvalidated reaches a checkout ref.
  check:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.client_payload.tag }}
      SCOPE: ${{ github.event.client_payload.scope }}
      PREVIOUS: ${{ github.event.client_payload.previous }}
    outputs:
      tag: ${{ steps.ok.outputs.tag }}
      scope: ${{ steps.ok.outputs.scope }}
      previous: ${{ steps.ok.outputs.previous }}
    steps:
      - name: Check the request
        id: ok
        run: |
          # Bash's =~ checks the whole value as one string, where grep would
          # pass a multi-line value on its one valid line — and a newline here
          # would write extra lines into GITHUB_OUTPUT below.
          for NAME in "$TAG" "$PREVIOUS"; do
            [ -z "$NAME" ] || [[ "$NAME" =~ ^[A-Za-z0-9._-]+$ ]] || {
              echo "::error::'${NAME}' is not a tag name."
              exit 1
            }
          done
          [ -n "$TAG" ] || { echo "::error::The request names no tag."; exit 1; }
          case "$SCOPE" in
            single) ;;
            *) echo "::error::Scope '${SCOPE}' is not one Nexus-AI can take (single)."; exit 1 ;;
          esac
          {
            echo "tag=$TAG"
            echo "scope=$SCOPE"
            echo "previous=$PREVIOUS"
          } >> "$GITHUB_OUTPUT"

  changelog:
    needs: check
    permissions:
      id-token: write   # OIDC sign-in to AWS, for the SSM settings
      contents: read
    uses: ./.github/workflows/changelog-run.yml
    with:
      source_repo: Seechange-edu/Nexus-AI
      tag: ${{ needs.check.outputs.tag }}
      scope: ${{ needs.check.outputs.scope }}
      previous: ${{ needs.check.outputs.previous }}
    secrets: inherit
